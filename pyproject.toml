[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpcns-post"
version = "0.2.0"
description = "API-first serial scientific post-processing for MPCNS Mercury output"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7"]
visualization = ["matplotlib", "pyvista"]

[project.scripts]
mpcns-post = "mpcns_post.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
